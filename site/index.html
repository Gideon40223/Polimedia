<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Polimedia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121417);--ink:light-dark(#15171C,#ECEEF2);--mute:light-dark(#5A5F6B,#A0A6B2);--body:light-dark(#4A4F5A,#C2C7D0);--line:light-dark(#E3E5EA,#2A2E36);--edge:light-dark(#D5D8DE,#3A3F49);--acc:light-dark(#1E47C8,#8AA4FF);--onacc:light-dark(#ffffff,#0D1430);--thumb:light-dark(#DADDE3,#252932);--vid:light-dark(#2A2E36,#1E2229);--soft:light-dark(#F5F6F8,#181B20)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;padding-bottom:6px}
.logo{font-family:'Newsreader',Georgia,serif;font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.02em}
.date{font-size:13px;color:var(--mute)}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.round[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--acc);color:var(--onacc);font-size:12px;line-height:20px;font-weight:600;border:2px solid var(--bg)}
.round[aria-pressed=true] .badge{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:6px;padding-bottom:12px;scrollbar-width:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--edge);background:var(--bg);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.side{display:none}
.stand{font-size:13px;color:var(--mute);margin:14px 0 0}
.day{padding:18px 0 4px;font-size:13px;font-weight:600;color:var(--mute)}
.card{padding:12px 0 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.meta{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.meta time{margin-left:auto;white-space:nowrap}
.thumb,.player{width:100%;aspect-ratio:16/9;border-radius:10px;border:0;padding:0;position:relative;display:grid;place-items:center;overflow:hidden}
.thumb{background:var(--vid);cursor:pointer}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb svg{position:relative;transition:transform .2s;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.thumb:hover svg{transform:scale(1.06)}
.player{background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vt,.at{margin:0;font-family:'Newsreader',Georgia,serif;font-weight:600;text-wrap:pretty}
.vt{font-size:21px;line-height:27px}
.vd{margin:-4px 0 0;font-size:14px;line-height:20px;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art{display:flex;gap:14px;align-items:flex-start;text-decoration:none}
.art>div:first-child{flex:1;display:flex;flex-direction:column;gap:6px}
.at{font-size:19px;line-height:25px}
.art:hover .at{color:var(--acc)}
.art p{margin:0;font-size:14px;line-height:20px;color:var(--body)}
.pic{flex:0 0 96px;height:96px;border-radius:8px;overflow:hidden;background:var(--thumb) repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--ink) 4%,transparent) 10px 20px)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.foot a{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none}
.foot a:hover{color:var(--acc)}
.plus{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:4px;border:1px solid var(--edge);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.save{width:44px;height:44px;margin-right:-12px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer;flex:none}
.save.on{color:var(--acc)}
.save.on path{fill:currentColor}
.pop{animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.3)}}
.more{display:flex;justify-content:center;padding:28px 0 48px}
.btn{min-height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--edge);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer}
.vhead h1{margin:16px 0 0;font-family:'Newsreader',Georgia,serif;font-size:32px;line-height:1.05;letter-spacing:-.02em}
.empty{padding:40px 0;color:var(--mute);max-width:40ch}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.off{color:#B42318}
.inst{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 8px 12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.inst[hidden]{display:none}
.inst img{width:40px;height:40px;border-radius:9px;flex:none}
.inst p{margin:0;flex:1 1 180px;font-size:14px;line-height:20px}
.inst p b{display:block;font-size:15px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.inst .x{width:44px;height:44px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:22px;line-height:1}
@media(min-width:900px){
.top .chips{display:none}
.layout{display:grid;grid-template-columns:240px minmax(0,720px);gap:40px;align-items:start}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:90px;padding-top:24px}
.side .lbl{font-size:13px;font-weight:600;color:var(--mute);padding:0 12px 4px}
.side .chip{text-align:left;border:0;border-radius:8px;padding:0 12px;font-size:15px}
.side .chip:not(.on):hover{background:var(--soft)}
.side ul{list-style:none;margin:0;padding:0 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.side li a{display:block;padding:5px 0;text-decoration:none}
.side li a:hover{color:var(--acc)}
.side li span{color:var(--mute);font-size:13px}
.side .q{margin-top:22px}
.vt{font-size:26px;line-height:33px}
.at{font-size:22px;line-height:29px}
.pic{flex-basis:168px;height:112px}
}
@media(prefers-reduced-motion:reduce){.pop{animation:none}.thumb svg{transition:none}}
</style>
</head>
<body>
<header class="top">
<div class="wrap bar">
<div><div class="logo">Polimedia</div><div class="date" id="date"></div></div>
<button class="round" id="savedBtn" aria-pressed="false" aria-label="Gemerkte Beiträge">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
<span class="badge" id="badge"></span>
</button>
</div>
<nav class="wrap chips" id="chips" aria-label="Filter"></nav>
</header>
<div class="wrap layout">
<aside class="side" aria-label="Filter und Quellen">
<div class="lbl">Filter</div>
<nav id="sideChips" style="display:flex;flex-direction:column;gap:2px"></nav>
<div class="lbl q">Quellen</div>
<ul id="srcList"></ul>
</aside>
<main>
<div class="inst" id="inst" hidden>
<img src="icon-192.png" alt="">
<p><b>Polimedia als App</b><span id="instText">Ein Tipp, und Polimedia liegt als App auf deinem Startbildschirm.</span></p>
<button class="btn pri" id="instBtn">Installieren</button>
<button class="x" id="instX" aria-label="Hinweis schließen">×</button>
</div>
<div id="feed"><p class="stand">Lädt …</p></div>
<div class="more" id="more" style="display:none"><button class="btn" id="moreBtn">Ältere Beiträge anzeigen</button></div>
</main>
</div>
<script>
{
const CAT={all:'Alle',Nachrichten:'Nachrichten','Content Creator':'Content Creator',Offiziell:'Offiziell'};
const store={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={f:store.get('pm-filter','all'),saved:store.get('pm-saved-v2',{}),view:'feed',limit:20,playing:null,data:[],sources:[],stand:null};
if(!CAT[S.f])S.f='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOW=new Date();
const dayKey=d=>d.toDateString();
const yest=new Date(NOW-864e5);
const dayName=d=>dayKey(d)===dayKey(NOW)?'Heute':dayKey(d)===dayKey(yest)?'Gestern':d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const hm=d=>d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const rel=d=>{const m=Math.round((NOW-d)/6e4);if(m<60)return'vor '+Math.max(m,1)+' Min.';if(dayKey(d)===dayKey(NOW))return'vor '+Math.round(m/60)+' Std.';return hm(d)+' Uhr'};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
const ICON={
book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
ext:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
lock:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
play:'<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="28" fill="#fff" fill-opacity=".92"/><path d="M23 18l15 10-15 10z" fill="#15171C"/></svg>'
};
const card=x=>{
const on=!!S.saved[x.id];
const save=`<button class="save${on?' on':''}" data-save="${x.id}" aria-pressed="${on}" aria-label="${on?'Nicht mehr merken':'Merken'}">${ICON.book}</button>`;
const meta=`<div class="meta"><b>${esc(x.quelle)}</b><span aria-hidden="true">·</span><span>${esc(x.kategorie)}</span><time datetime="${x.datum.toISOString()}">${rel(x.datum)}</time></div>`;
if(x.typ==='video'){
const vis=S.playing===x.id
?`<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(x.video_id)}?autoplay=1&rel=0" title="${esc(x.titel)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
:`<button class="thumb" data-play="${x.id}" aria-label="Video abspielen: ${esc(x.titel)}">${x.bild?`<img src="${esc(x.bild)}" alt="" loading="lazy" onerror="this.remove()">`:''}${ICON.play}</button>`;
return `<article class="card">${meta}${vis}<h2 class="vt">${esc(x.titel)}</h2>${x.anreisser?`<p class="vd">${esc(x.anreisser)}</p>`:''}<div class="foot"><a href="${esc(x.link)}" target="_blank" rel="noopener">Auf YouTube ansehen ${ICON.ext}</a>${save}</div></article>`;
}
return `<article class="card">${meta}<a class="art" href="${esc(x.link)}" target="_blank" rel="noopener"><div><h2 class="at">${esc(x.titel)}</h2>${x.anreisser?`<p>${esc(x.anreisser)}</p>`:''}</div><div class="pic">${x.bild?`<img src="${esc(x.bild)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div></a><div class="foot"><span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><a href="${esc(x.link)}" target="_blank" rel="noopener">Artikel · ${esc(host(x.link))} ${ICON.ext}</a>${x.bezahl?`<span class="plus">${ICON.lock} Paywall</span>`:''}</span>${save}</div></article>`;
};
const chips=()=>Object.keys(CAT).map(k=>{const on=S.view==='feed'&&S.f===k;return `<button class="chip${on?' on':''}" data-f="${esc(k)}" aria-pressed="${on}">${CAT[k]}</button>`}).join('');
const render=()=>{
$('chips').innerHTML=chips();$('sideChips').innerHTML=chips();
const n=Object.keys(S.saved).length;
$('savedBtn').setAttribute('aria-pressed',S.view==='saved');
$('badge').textContent=n;$('badge').style.display=n?'':'none';
let html='';
if(S.view==='saved'){
const list=Object.values(S.saved).map(x=>({...x,datum:new Date(x.datum)})).sort((a,b)=>b.datum-a.datum);
html+=`<div class="vhead"><h1>Gemerkt</h1></div><p class="stand">${list.length} ${list.length===1?'Beitrag':'Beiträge'}, nur in diesem Browser gespeichert.</p>`;
if(!list.length)html+=`<div class="empty"><strong>Noch nichts gemerkt</strong>Tippe bei einem Beitrag auf das Lesezeichen, dann taucht er hier auf.</div>`;
html+=list.map(card).join('');
$('more').style.display='none';
}else{
const all=S.data.filter(x=>S.f==='all'||x.kategorie===S.f);
const list=all.slice(0,S.limit);
if(S.stand)html+=`<p class="stand">Aktualisiert ${rel(S.stand)==='vor 1 Min.'?'gerade eben':rel(S.stand)}</p>`;
if(!list.length)html+=`<div class="empty"><strong>Gerade keine Beiträge</strong>In dieser Kategorie ist in den letzten 7 Tagen nichts erschienen.</div>`;
let last='';
for(const x of list){const dn=dayName(x.datum);if(dn!==last){html+=`<div class="day">${dn}</div>`;last=dn}html+=card(x)}
$('more').style.display=all.length>S.limit?'':'none';
}
$('feed').innerHTML=html;
};
$('date').textContent=NOW.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
document.addEventListener('click',e=>{
const f=e.target.closest('[data-f]'),p=e.target.closest('[data-play]'),s=e.target.closest('[data-save]');
if(f){S.f=f.dataset.f;S.view='feed';S.limit=20;S.playing=null;store.set('pm-filter',S.f);render();window.scrollTo({top:0});return}
if(p){S.playing=p.dataset.play;render();return}
if(s){const id=s.dataset.save;if(S.saved[id])delete S.saved[id];else{const x=S.data.find(d=>d.id===id);if(x)S.saved[id]={...x,datum:x.datum.toISOString()}}store.set('pm-saved-v2',S.saved);render();const b=document.querySelector(`[data-save="${id}"]`);if(b){b.classList.add('pop');b.focus({preventScroll:true})}}
});
$('savedBtn').addEventListener('click',()=>{S.view=S.view==='saved'?'feed':'saved';S.playing=null;render();window.scrollTo({top:0})});
$('moreBtn').addEventListener('click',()=>{S.limit+=20;render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
// App-Installieren-Hinweis: Android/Chrome mit echtem Knopf, iPhone mit kurzer Anleitung
let installEvt=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const showInst=ios=>{if(standalone||store.get('pm-inst-x',false))return;$('inst').hidden=false;if(ios){$('instText').textContent='Unten auf Teilen tippen, dann „Zum Home-Bildschirm“.';$('instBtn').hidden=true}};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;showInst(false)});
addEventListener('appinstalled',()=>{$('inst').hidden=true});
if(isIOS)showInst(true);
$('instBtn').addEventListener('click',async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;$('inst').hidden=true});
$('instX').addEventListener('click',()=>{$('inst').hidden=true;store.set('pm-inst-x',true)});
fetch('feed.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
S.data=d.beitraege.map(x=>({...x,datum:new Date(x.datum)}));
S.stand=new Date(d.stand);
$('srcList').innerHTML=d.quellen.map(q=>`<li><a href="${esc(q.website)}" target="_blank" rel="noopener">${esc(q.name)} <span${q.ok?'':' class="off"'}>${q.ok?esc(q.kategorie):'gerade nicht erreichbar'}</span></a></li>`).join('');
render();
}).catch(()=>{$('feed').innerHTML=`<div class="empty"><strong>Feed konnte nicht geladen werden</strong>Die Datei feed.json fehlt oder ist kaputt. Läuft die Automatik auf GitHub?</div>`;$('chips').innerHTML=chips()});
}
</script>
</body>
</html>
